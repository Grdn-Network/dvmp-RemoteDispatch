<!DOCTYPE html>
<html>
<head>
	<title>Derail Valley Remote Dispatch Console</title>
	<link rel="icon" href="res/icon.svg">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.7.1/dist/leaflet.css" integrity="sha256-BPfK9M5v34c2XP6p0cxVz1mUQLst0gTLk0mlc7kuodA=" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-sidebar-v2@3.2.3/css/leaflet-sidebar.min.css" integrity="sha256-10dwwxs/pdWEYoC56aJvmY3kbMMa9/3uSWWNkGcrGq8=" crossorigin="anonymous">
	<link rel="stylesheet" href="res/style.css">
	<link rel="stylesheet" href="res/ctc.css">
	<script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/js/all.min.js" integrity="sha256-gSqw5G+Gss6YqyQlqyIkuQ0IRZUqGsDVq9c0tiF+mL8=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/leaflet@1.7.1/dist/leaflet-src.js" integrity="sha256-dG7rUAec0UN0e3nlMEuYJzsbK0rpoz4hBbNp0ir9iF8=" crossorigin="anonymous"></script>
	<script src="res/leaflet.rotatedImageOverlay.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/leaflet-sidebar-v2@3.2.3/js/leaflet-sidebar.min.js" integrity="sha256-4r81BYKeNxSG+nrK/UPQq75pDlH+GkiZn/zc/xkNMLA=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@zerowastemap/leaflet.zoomhome@1.0.0/index.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/tablesort@5.2.1/src/tablesort.js" integrity="sha256-ams/0yjSE7HGIRWB/A3VtW3Z24eOT+5z0z9d1pms7T4=" crossorigin="anonymous"></script>
</head>
<body>
	<div id="sidebar" class="leaflet-sidebar collapsed">
		<div class="leaflet-sidebar-tabs">
			<ul role="tablist">
				<li><a href="#carsTab" role="tab"><i class="fas fa-train" title="Cars"></i></a></li>
				<li><a href="#locoFilterTab" role="tab"><i class="fas fa-eye" title="Loco select"></i></a></li>
				<li><a href="#jobsTab" role="tab"><i class="fas fa-clipboard-list" title="Jobs"></i></a></li>
				<li><a href="#trainBoardTab" role="tab"><i class="fas fa-table" title="Train Board"></i></a></li>
				<li><a href="#locoControlTab" role="tab"><i class="fas fa-gamepad" title="Loco Control"></i></a></li>
				<li><a href="#settingsTab" role="tab"><i class="fas fa-cog" title="Settings"></i></a></li>
				<li><a href="#signals-sidebar" role="tab"><i class="fas fa-traffic-light" title="Signals"></i></a></li>
			</ul>
		</div>
		<div class="leaflet-sidebar-content">
			<div class="leaflet-sidebar-pane" id="carsTab">
				<h1 class="leaflet-sidebar-header">
					Rolling stock
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<table id="carList">
					<thead>
						<tr><th>ID</th><th>Job</th><th>Dest</th></tr>
					</thead>
					<tbody id="carListBody"></tbody>
				</table>
			</div>
			<div class="leaflet-sidebar-pane" id="locoFilterTab">
				<h1 class="leaflet-sidebar-header">
					Loco visibility
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<table id="locoList">
					<thead>
						<tr><th>ID</th><th>Highlight</th></tr>
					</thead>
					<tbody id="locoListBody"></tbody>
				</table>
			</div>
			<div class="leaflet-sidebar-pane" id="jobsTab">
				<h1 class="leaflet-sidebar-header">
					Jobs
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<input id="jobSearchText" type="text" placeholder="Search...">
				<label>active only<input id="jobActiveOnly" type="checkbox"></label>
				<table id="jobList">
					<tbody id="jobListBody"></tbody>
				</table>
			</div>
			<div class="leaflet-sidebar-pane" id="trainBoardTab">
				<h1 class="leaflet-sidebar-header">
					Train Board
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<table id="trainBoardTable">
					<thead>
						<tr>
							<th>#</th>
							<th>Crew</th>
							<th>Type</th>
							<th>Cars</th>
							<th>Job</th>
							<th>Dest</th>
							<th>km/h</th>
						</tr>
					</thead>
					<tbody id="trainBoardBody"></tbody>
				</table>
			</div>
			<div class="leaflet-sidebar-pane" id="locoControlTab">
				<h1 class="leaflet-sidebar-header">
					Loco control
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<div id="locoControlIndicators">
					<label for="locoControlLocoId">L-</label>
					<select id="locoControlLocoId"></select>
					<span id="locoControlBrakePipe"></span> bar
					<span id="locoControlForwardSpeed"></span> km/h
				</div>
				<div id="locoControlControls">
					<div>
						<label for="locoControlTrainBrakeInput">Train Brk</label>
						<input id="locoControlTrainBrakeInput" type="range">
					</div>
					<div>
						<label for="locoControlIndependentBrakeInput">Indep Brk</label>
						<input id="locoControlIndependentBrakeInput" type="range">
					</div>
					<div>
						<label>Reverser</label>
						<span id="locoControlReverserReverseButton" class="locoControlButton" locoControlCommand="reverse"><i class="far fa-play-circle fa-flip-horizontal" title="Reverse"></i></span>
						<span id="locoControlReverserForwardButton" class="locoControlButton" locoControlCommand="forward"><i class="far fa-play-circle" title="Forward"></i></span>
					</div>
					<div>
						<label for="locoControlThrottleInput">Throttle</label>
						<input id="locoControlThrottleInput" type="range">
					</div>
					<div>
						<button id="locoControlCoupleButton">Couple</button>
					</div>
					<div>
						<button id="locoControlUncoupleButton">Uncouple</button>
						<select id="locoControlUncoupleSelect"></select>
					</div>
				</div>
			</div>
			<div class="leaflet-sidebar-pane" id="signals-sidebar">
				<h1 class="leaflet-sidebar-header">
					Signals
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<div id="signals-sidebar-content">
					<!-- Populated by buildSignalsSidebar() after signalsReady resolves -->
				</div>
			</div>
			<div class="leaflet-sidebar-pane" id="settingsTab">
				<h1 class="leaflet-sidebar-header">
					Settings
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<table>
					<tr>
						<th><label for="themeDropdown">Theme</label></th>
						<td>
							<select name="theme" id="themeDropdown">
								<option value="dark">Dark</option>
								<option value="light">Light</option>
							</select>
						</td>
					</tr>
					<tr>
						<th><label for="carColorDropdown">Car color</label></th>
						<td>
							<select name="carColor" id="carColorDropdown">
								<option value="destination">by destination</option>
								<option value="jobId">by job ID</option>
								<option value="jobType">by job type</option>
								<option value="carType">by car type</option>
							</select>
						</td>
					</tr>
					<tr>
						<th><label for="playerScalingCheckbox">Player icon scaling</label></th>
						<td><input type="checkbox" id="playerScalingCheckbox" checked></td>
					</tr>
					<tr>
						<th><label for="playerNameCheckbox">Show player names</label></th>
						<td><input type="checkbox" id="playerNameCheckbox" checked></td>
					</tr>
					<tr>
						<th><label for="mapBackgroundCheckbox">Map background</label></th>
						<td><input type="checkbox" id="mapBackgroundCheckbox" checked></td>
					</tr>
					<tr>
						<th><label for="customOverlayCheckbox">Custom overlay</label></th>
						<td><input type="checkbox" id="customOverlayCheckbox"></td>
					</tr>
					<tr>
						<th><label for="customOverlayFile">Image file</label></th>
						<td><input type="file" id="customOverlayFile" accept="image/*"></td>
					</tr>
					<tr>
						<th><label for="customOverlayUrl">or URL</label></th>
						<td><input type="text" id="customOverlayUrl" placeholder="https://…"></td>
					</tr>
					<tr>
						<th><label for="customOverlayOpacity">Overlay opacity</label></th>
						<td><input type="range" id="customOverlayOpacity" min="0" max="100" value="70"></td>
					</tr>
				</table>
			</div>
		</div>
	</div>
	<div id="map" class="dark" style="height:100vh"></div>

	<!-- CTC schematic dispatch panel. Hidden until the mode toggle activates it;
	     shares the live data feed with the map. -->
	<div id="ctc-panel">
		<svg id="ctc-schematic" xmlns="http://www.w3.org/2000/svg"></svg>

		<!-- Zone claim/release chips (populated from /zones) -->
		<div id="ctc-zonebar"></div>

		<!-- Bulk signal control: take all / in-view / none under manual red -->
		<div id="ctc-toolbar">
			<span class="ctc-toolbar-label">Signals</span>
			<button id="ctc-sig-all" title="Set every signal to manual red">Hold all</button>
			<button id="ctc-sig-view" title="Hold the signals currently in view">Hold view</button>
			<button id="ctc-sig-release" title="Return all signals to automatic">Release</button>
			<span class="ctc-toolbar-sep"></span>
			<button id="ctc-route-btn" title="Set a route: click junction A then B">Route</button>
			<button id="ctc-route-clear" title="Release all active routes (signals back to red)">Clear</button>
			<span id="ctc-toolbar-status"></span>
		</div>

		<!-- Route preview confirmation -->
		<div id="ctc-route-confirm">
			<span id="ctc-route-confirm-text"></span>
			<button id="ctc-route-set">Set</button>
			<button id="ctc-route-cancel">Cancel</button>
		</div>

		<!-- Train transfer offer banner -->
		<div id="ctc-xfer-banner">
			<span id="ctc-xfer-text"></span>
			<button id="ctc-xfer-accept">Accept</button>
			<button id="ctc-xfer-reject">Reject</button>
		</div>

		<!-- Shared notepad + dispatcher chat -->
		<div id="ctc-collab">
			<div id="ctc-collab-tabs">
				<button class="ctc-tab active" data-tab="notes">Notes</button>
				<button class="ctc-tab" data-tab="chat">Chat</button>
			</div>
			<textarea id="ctc-notes-area" placeholder="Shared dispatcher notes…"></textarea>
			<div id="ctc-chat-wrap">
				<div id="ctc-chat-log"></div>
				<input id="ctc-chat-input" type="text" placeholder="Send message…" autocomplete="off">
			</div>
		</div>
	</div>

	<button id="modeToggle" title="Toggle CTC / Map view">CTC</button>
	<div id="search">
		<input id="searchInput" type="text" placeholder="Go to…" autocomplete="off">
		<ul id="searchResults"></ul>
	</div>
	<script src="res/ctc-layout.js"></script>
	<script src="res/ctc.js"></script>
	<script src="res/main.js"></script>
</body>
</html>
